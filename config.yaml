test:
  # APV management interface configuration
  # apv_management_ip: 140.118.109.106
  # apv_management_port: 6666
  apv_management_ip: 192.168.1.247
  apv_management_port: 22
  apv_username: array
  apv_password: Aclab@6768
  apv_enable_password: ""
  
  # Traffic generator configuration
  traffic_generator:
    # Management interface connection information
    dperf_path: ~/dperf
    dpdk_path: ~/dpdk
    management_ip: 192.168.1.207
    management_port: 22
    # management_ip: 140.118.109.106
    # management_port: 6667
    username: root
    password: array

    # Hugepages configuration
    hugepage_frames: 2  # Number of hugepages (frame count)
    hugepage_size: 1G   # Hugepage size (1G or 2M)

    # Total test duration and buffer time
    duration: 1m
    client_buffer_time: 33s
    server_buffer_time: 3s

    pairs:
      # ============ Pair 1 ============
      - client:
          # NIC PCI address (for DPDK binding)
          client_nic_pci: 0000:b6:00.0

          client_nic_name: enp182s0f0

          # Original NIC driver (for recovery when unbinding)
          client_nic_driver: i40e

          # Client starting IP address
          client_ip: 10.10.11.1

          # Number of simulated client IPs (used to generate multiple source IPs)
          source_ip_nums: 60

          # Client default gateway
          client_gw: 10.10.11.100

          # Test duration is controlled by traffic_generator.duration

          # Number of CPU cores used (affects parallel processing capability)
          client_cpu_core: 6

          # Packet batch size per transmission (affects transmission efficiency)
          tx_burst: 1024

          # Number of connections launched simultaneously
          launch_num: 100

          # Concurrent connections (2k = 2000 concurrent connections)
          cc: 2k

          # TCP keepalive interval (us=microsecond, ms=millisecond, s=second)
          keepalive: 1us

          # Enable RSS (Receive Side Scaling, multi-queue NIC load balancing)
          rss: true

          # DPDK memory pool size (MB)
          socket_mem: 1024

          virtual_server_ip: 10.10.11.101

          virtual_server_port: 6769

          server_port_nums: 1

        server:
          # NIC PCI address (for DPDK binding)
          server_nic_pci: 0000:b6:00.1

          server_nic_name: enp182s0f1

          # Original NIC driver (for recovery when unbinding)
          server_nic_driver: i40e

          # Server IP address
          server_ip: 10.10.12.1

          # Server default gateway
          server_gw: 10.10.12.100

          # Test duration is controlled by traffic_generator.duration

          # Number of CPU cores used
          server_cpu_core: 14

          # Packet batch size per transmission
          tx_burst: 1024

          # TCP keepalive interval
          keepalive: 1us

          # Enable RSS (multi-queue NIC load balancing)
          rss: true

          # DPDK memory pool size (MB)
          socket_mem: 1024

          # Starting port number to listen on
          listen_port: 6768

          # Number of ports to listen on (for spreading load)
          listen_port_nums: 1
        # Payload size per packet (bytes)
        payload_size: 1024

        # Protocol (tcp/udp/http)
        protocol: tcp